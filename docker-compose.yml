services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizmark_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./storage/app/public:/var/www/public/storage
    networks:
      - bizmark_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=bizmark_db
      - DB_USERNAME=bizmark_user
      - DB_PASSWORD=bizmark_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis

  web:
    image: nginx:alpine
    container_name: bizmark_web
    restart: unless-stopped
    ports:
      - "0.0.0.0:8081:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - bizmark_network
    depends_on:
      - app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizmark_worker
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-jobs=500 --timeout=120
    volumes:
      - ./:/var/www
    networks:
      - bizmark_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=bizmark_db
      - DB_USERNAME=bizmark_user
      - DB_PASSWORD=bizmark_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis

  worker-email:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizmark_worker_email
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --queue=email --sleep=3 --tries=2 --max-jobs=200 --timeout=600
    volumes:
      - ./:/var/www
    networks:
      - bizmark_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=bizmark_db
      - DB_USERNAME=bizmark_user
      - DB_PASSWORD=bizmark_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis

  worker-documents:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizmark_worker_documents
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --queue=documents --sleep=3 --tries=3 --max-jobs=100 --timeout=120
    volumes:
      - ./:/var/www
    networks:
      - bizmark_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=bizmark_db
      - DB_USERNAME=bizmark_user
      - DB_PASSWORD=bizmark_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis

  worker-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizmark_worker_ai
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --queue=ai --sleep=3 --tries=3 --max-jobs=100 --timeout=300
    volumes:
      - ./:/var/www
    networks:
      - bizmark_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=bizmark_db
      - DB_USERNAME=bizmark_user
      - DB_PASSWORD=bizmark_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizmark_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www
    networks:
      - bizmark_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=bizmark_db
      - DB_USERNAME=bizmark_user
      - DB_PASSWORD=bizmark_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  db:
    image: postgres:14-alpine
    container_name: bizmark_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: bizmark_db
      POSTGRES_USER: bizmark_user
      POSTGRES_PASSWORD: bizmark_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - bizmark_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizmark_user -d bizmark_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bizmark_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - bizmark_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  civic_stack:
    build:
      context: ./docker/civic-stack
      dockerfile: Dockerfile
    container_name: bizmark_civic_stack
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OSS_USERNAME=academos84761162024s
      - OSS_PASSWORD=T@n12089
    networks:
      - bizmark_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  searxng:
    image: searxng/searxng:latest
    container_name: bizmark_searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - searxng_data:/etc/searxng
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - bizmark_network

volumes:
  pg_data:
  redis_data:
  searxng_data:

networks:
  bizmark_network:
    driver: bridge