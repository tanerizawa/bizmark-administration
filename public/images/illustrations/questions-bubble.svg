<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" fill="none" aria-hidden="true">
    <defs>
        <linearGradient id="bubbleGold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#d4a847" stop-opacity="0.14"/>
            <stop offset="100%" stop-color="#b8860b" stop-opacity="0.04"/>
        </linearGradient>
    </defs>

    <!-- Soft ground shadow -->
    <ellipse cx="140" cy="200" rx="110" ry="10" fill="#0f172a" opacity="0.04"/>

    <!-- Big bubble (back) -->
    <g>
        <path d="M50 50 L210 50 Q230 50 230 70 L230 140 Q230 160 210 160 L130 160 L110 185 L110 160 L70 160 Q50 160 50 140 Z"
              fill="url(#bubbleGold)" stroke="#b8860b" stroke-width="1.5"/>
        <text x="140" y="118" text-anchor="middle" font-family="serif" font-size="64" font-weight="bold" fill="#b8860b" opacity="0.85">?</text>
    </g>

    <!-- Small bubble (front, navy) -->
    <g transform="translate(160 30)">
        <path d="M0 0 L80 0 Q92 0 92 12 L92 48 Q92 60 80 60 L40 60 L28 75 L28 60 L12 60 Q0 60 0 48 Z"
              fill="#0f172a" opacity="0.95"/>
        <text x="46" y="40" text-anchor="middle" font-family="serif" font-size="28" font-weight="bold" fill="#fff">?</text>
    </g>

    <!-- Tiny accent dot bubble -->
    <g transform="translate(20 130)">
        <circle cx="14" cy="14" r="14" fill="#b8860b" opacity="0.85"/>
        <text x="14" y="20" text-anchor="middle" font-family="serif" font-size="18" font-weight="bold" fill="#fff">?</text>
    </g>

    <!-- Floating accent dots -->
    <circle cx="240" cy="80" r="3" fill="#b8860b" opacity="0.5"/>
    <circle cx="35" cy="60" r="2.5" fill="#b8860b" opacity="0.4"/>
    <circle cx="200" cy="180" r="3" fill="#b8860b" opacity="0.5"/>
</svg>
