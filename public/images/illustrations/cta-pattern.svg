<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
    <defs>
        <pattern id="ctaGrid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#b8860b" opacity="0.18"/>
        </pattern>
        <radialGradient id="ctaGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#b8860b" stop-opacity="0.12"/>
            <stop offset="60%" stop-color="#b8860b" stop-opacity="0.04"/>
            <stop offset="100%" stop-color="#b8860b" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Dotted grid pattern background -->
    <rect width="1200" height="400" fill="url(#ctaGrid)"/>

    <!-- Soft glow center -->
    <circle cx="600" cy="200" r="280" fill="url(#ctaGlow)"/>

    <!-- Decorative arcs left -->
    <g opacity="0.4">
        <circle cx="120" cy="200" r="80" stroke="#b8860b" stroke-width="1" fill="none" stroke-dasharray="3 6"/>
        <circle cx="120" cy="200" r="120" stroke="#b8860b" stroke-width="1" fill="none" stroke-dasharray="2 8" opacity="0.5"/>
    </g>

    <!-- Decorative arcs right -->
    <g opacity="0.4">
        <circle cx="1080" cy="200" r="80" stroke="#b8860b" stroke-width="1" fill="none" stroke-dasharray="3 6"/>
        <circle cx="1080" cy="200" r="120" stroke="#b8860b" stroke-width="1" fill="none" stroke-dasharray="2 8" opacity="0.5"/>
    </g>

    <!-- Floating accent shapes -->
    <circle cx="200" cy="80" r="4" fill="#b8860b" opacity="0.3"/>
    <circle cx="1000" cy="120" r="3" fill="#b8860b" opacity="0.3"/>
    <circle cx="900" cy="320" r="5" fill="#b8860b" opacity="0.25"/>
    <circle cx="280" cy="340" r="4" fill="#b8860b" opacity="0.3"/>
</svg>
