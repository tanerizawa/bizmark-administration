<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Bizmark.ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0f1e;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container { text-align: center; max-width: 420px; }
        .icon {
            width: 80px; height: 80px;
            background: rgba(59,130,246,.12);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .icon svg { width: 36px; height: 36px; fill: none; stroke: #3b82f6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .75rem; color: #f1f5f9; }
        p { color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
        .btn {
            display: inline-flex; align-items: center; gap: .5rem;
            padding: .75rem 1.5rem; font-size: .9375rem; font-weight: 600;
            border-radius: 10px; border: none; cursor: pointer;
            background: #3b82f6; color: #fff;
            text-decoration: none; transition: background .2s;
        }
        .btn:hover { background: #2563eb; }
        .btn i { font-size: .875rem; }
        .status { font-size: .75rem; color: #475569; margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24">
                <line x1="1" y1="1" x2="23" y2="23"/>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
                <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                <line x1="12" y1="20" x2="12.01" y2="20"/>
            </svg>
        </div>
        <h1>Koneksi Terputus</h1>
        <p>Anda sedang offline. Periksa koneksi internet Anda dan coba lagi. Beberapa halaman yang sudah dikunjungi sebelumnya mungkin masih bisa diakses.</p>
        <button class="btn" onclick="window.location.reload()">
            <span>&#x21bb;</span> Coba Lagi
        </button>
        <div class="status">
            <span id="onlineStatus">Menunggu koneksi...</span>
        </div>
    </div>
    <script>
        function updateOnlineStatus() {
            const el = document.getElementById('onlineStatus');
            if (navigator.onLine) {
                el.textContent = 'Koneksi tersedia — memuat ulang...';
                setTimeout(function() { window.location.reload(); }, 1500);
            } else {
                el.textContent = 'Masih offline. Silakan periksa koneksi Anda.';
            }
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();
    </script>
</body>
</html>
