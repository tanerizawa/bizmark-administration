name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHPUnit (Feature + Unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, xml, curl, intl
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-php84-${{ hashFiles('composer.lock') }}
          restore-keys: composer-php84-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Setup .env
        run: |
          cp .env.testing.example .env
          php artisan key:generate --force --no-interaction

      - name: Clear framework caches
        run: |
          php artisan config:clear
          php artisan route:clear

      - name: Run PHPUnit
        run: php artisan test --no-coverage

  pint:
    name: Laravel Pint (code style)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-php84-${{ hashFiles('composer.lock') }}
          restore-keys: composer-php84-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --quiet

      - name: Run Pint (dry-run)
        run: ./vendor/bin/pint --test
        continue-on-error: true

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test, pint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 300s
          script: |
            set -euo pipefail
            cd /home/bizmark/bizmark.id
            git fetch origin main
            git reset --hard origin/main
            APP_PATH=/home/bizmark/bizmark.id PHP_BIN=php COMPOSER_BIN=composer WEB_USER=www-data WEB_GROUP=www-data bash scripts/deploy-vps.sh

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/bizmark/bizmark.id
            php artisan about --only=environment 2>/dev/null | grep -E "Environment|Debug|Version"
            echo "Deploy verified OK"
