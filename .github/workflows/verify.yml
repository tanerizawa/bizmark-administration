# W18-01: verifikasi ringan (audit string + PHPUnit Unit + route:list).
# Tidak menyentuh DB produksi; selaras scripts/verify-post-scrub-local.sh
name: Verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, xml, curl, intl
          coverage: none
          tools: composer:v2

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Laravel .env (testing)
        run: |
          cp .env.testing.example .env
          php artisan key:generate --force --no-interaction

      - name: Verify script
        run: bash scripts/verify-post-scrub-local.sh
